resources:
  jobs:
    observatorio_daily_pipeline:
      name: observatorio_daily_pipeline
      schedule:
        quartz_cron_expression: 28 0 8 * * ?
        timezone_id: America/Bogota
        pause_status: UNPAUSED
      tasks:
        - task_key: ing_demanda_real
          notebook_task:
            notebook_path: /Workspace/Users/jgomezdelahoz2108@gmail.com/observatorio-energetico-de-colombia/Ingestion/Demanda_real
            source: WORKSPACE
        - task_key: ing_disponibilidad
          notebook_task:
            notebook_path: /Workspace/Users/jgomezdelahoz2108@gmail.com/observatorio-energetico-de-colombia/Ingestion/Disponibilidad
              Planta
            source: WORKSPACE
        - task_key: ing_agentes
          depends_on:
            - task_key: ing_disponibilidad
          notebook_task:
            notebook_path: /Workspace/Users/jgomezdelahoz2108@gmail.com/observatorio-energetico-de-colombia/Ingestion/agentes
            source: WORKSPACE
        - task_key: ing_generacion_Real
          notebook_task:
            notebook_path: /Workspace/Users/jgomezdelahoz2108@gmail.com/observatorio-energetico-de-colombia/Ingestion/generacion_real
            source: WORKSPACE
        - task_key: ing_niveles_embalse
          notebook_task:
            notebook_path: /Workspace/Users/jgomezdelahoz2108@gmail.com/observatorio-energetico-de-colombia/Ingestion/Nivel
              embalses dado por plantas
            source: WORKSPACE
        - task_key: ing_plantas
          depends_on:
            - task_key: ing_generacion_Real
          notebook_task:
            notebook_path: /Workspace/Users/jgomezdelahoz2108@gmail.com/observatorio-energetico-de-colombia/Ingestion/Plantas
            source: WORKSPACE
        - task_key: ing_precio_bolsa
          notebook_task:
            notebook_path: /Workspace/Users/jgomezdelahoz2108@gmail.com/observatorio-energetico-de-colombia/Ingestion/PrecioBolsa
            source: WORKSPACE
        - task_key: bronze_daily
          depends_on:
            - task_key: ing_precio_bolsa
            - task_key: ing_niveles_embalse
            - task_key: ing_plantas
            - task_key: ing_agentes
            - task_key: ing_disponibilidad
            - task_key: ing_demanda_real
            - task_key: ing_generacion_Real
          notebook_task:
            notebook_path: /Workspace/Users/jgomezdelahoz2108@gmail.com/observatorio-energetico-de-colombia/Bronze_Load/02_bronze_daily
            source: WORKSPACE
        - task_key: slv_agentes
          depends_on:
            - task_key: bronze_daily
          notebook_task:
            notebook_path: /Workspace/Users/jgomezdelahoz2108@gmail.com/observatorio-energetico-de-colombia/Silver_Load/silver_agentes
            source: WORKSPACE
        - task_key: slv_demanda_real
          depends_on:
            - task_key: bronze_daily
          notebook_task:
            notebook_path: /Workspace/Users/jgomezdelahoz2108@gmail.com/observatorio-energetico-de-colombia/Silver_Load/silver_demanda_real
            source: WORKSPACE
        - task_key: slv_disponibilidad
          depends_on:
            - task_key: bronze_daily
          notebook_task:
            notebook_path: /Workspace/Users/jgomezdelahoz2108@gmail.com/observatorio-energetico-de-colombia/Silver_Load/silver_disponibilidad_plantas
            source: WORKSPACE
        - task_key: slv_generacion
          depends_on:
            - task_key: bronze_daily
          notebook_task:
            notebook_path: /Workspace/Users/jgomezdelahoz2108@gmail.com/observatorio-energetico-de-colombia/Silver_Load/silver_generacion_real
            source: WORKSPACE
        - task_key: slv_niveleles_embalses
          depends_on:
            - task_key: slv_agentes
          notebook_task:
            notebook_path: /Workspace/Users/jgomezdelahoz2108@gmail.com/observatorio-energetico-de-colombia/Silver_Load/silver_niveles_embalses
            source: WORKSPACE
        - task_key: slv_plantas
          depends_on:
            - task_key: bronze_daily
          notebook_task:
            notebook_path: /Workspace/Users/jgomezdelahoz2108@gmail.com/observatorio-energetico-de-colombia/Silver_Load/silver_plantas
            source: WORKSPACE
        - task_key: slv_precio_bolsa
          depends_on:
            - task_key: bronze_daily
          notebook_task:
            notebook_path: /Workspace/Users/jgomezdelahoz2108@gmail.com/observatorio-energetico-de-colombia/Silver_Load/silver_precio_bolsa
            source: WORKSPACE
        - task_key: gold_daily
          depends_on:
            - task_key: slv_demanda_real
            - task_key: slv_precio_bolsa
            - task_key: slv_niveleles_embalses
            - task_key: slv_plantas
            - task_key: slv_disponibilidad
            - task_key: slv_agentes
            - task_key: slv_generacion
          notebook_task:
            notebook_path: /Workspace/Users/jgomezdelahoz2108@gmail.com/observatorio-energetico-de-colombia/GOLD
              LOAD/GOLD_LOAD
            source: WORKSPACE
          max_retries: 1
          min_retry_interval_millis: 300000
          disable_auto_optimization: false
        - task_key: gold_analytics
          depends_on:
            - task_key: gold_daily
          notebook_task:
            notebook_path: /Workspace/Users/jgomezdelahoz2108@gmail.com/observatorio-energetico-de-colombia/Gold_Analytics/01_vistas_dashboard
            source: WORKSPACE
        - task_key: quality_check
          depends_on:
            - task_key: gold_daily
          notebook_task:
            notebook_path: /Workspace/Users/jgomezdelahoz2108@gmail.com/observatorio-energetico-de-colombia/Automation/gold_incremental_quality_checks
            base_parameters:
              lookback_days: "45"
              max_lag_days: "45"
            source: WORKSPACE
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
