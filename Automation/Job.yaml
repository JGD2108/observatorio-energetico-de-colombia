resources:
  jobs:
    observatorio_daily_pipeline:
      name: observatorio_daily_pipeline_${bundle.target}
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: 0 0 8 * * ?
        timezone_id: America/Bogota
        pause_status: UNPAUSED
      parameters:
        - { name: environment, default: "${var.environment}" }
        - { name: catalog, default: "${var.catalog}" }
        - { name: historical_start_date, default: "${var.historical_start_date}" }
        - { name: lookback_days, default: "${var.lookback_days}" }
        - { name: max_lag_days, default: "${var.max_lag_days}" }
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - "pydataxm==0.3.18"
              - "geopy==2.5.0"
      tasks:
        - task_key: setup_catalog
          environment_key: default
          notebook_task: { notebook_path: "${workspace.file_path}/setup/00_bootstrap.py", source: WORKSPACE }

        - task_key: ing_demanda_real
          depends_on: [{ task_key: setup_catalog }]
          environment_key: default
          notebook_task: { notebook_path: "${workspace.file_path}/Ingestion/Demanda_real.py", source: WORKSPACE }
        - task_key: ing_disponibilidad
          depends_on: [{ task_key: setup_catalog }]
          environment_key: default
          notebook_task: { notebook_path: "${workspace.file_path}/Ingestion/Disponibilidad Planta.py", source: WORKSPACE }
        - task_key: ing_agentes
          depends_on: [{ task_key: setup_catalog }]
          environment_key: default
          notebook_task: { notebook_path: "${workspace.file_path}/Ingestion/agentes.py", source: WORKSPACE }
        - task_key: ing_generacion_real
          depends_on: [{ task_key: setup_catalog }]
          environment_key: default
          notebook_task: { notebook_path: "${workspace.file_path}/Ingestion/generacion_real.py", source: WORKSPACE }
        - task_key: ing_niveles_embalses
          depends_on: [{ task_key: setup_catalog }]
          environment_key: default
          notebook_task: { notebook_path: "${workspace.file_path}/Ingestion/Nivel embalses dado por plantas.py", source: WORKSPACE }
        - task_key: ing_plantas
          depends_on: [{ task_key: setup_catalog }]
          environment_key: default
          notebook_task: { notebook_path: "${workspace.file_path}/Ingestion/Plantas.py", source: WORKSPACE }
        - task_key: ing_precio_bolsa
          depends_on: [{ task_key: setup_catalog }]
          environment_key: default
          notebook_task: { notebook_path: "${workspace.file_path}/Ingestion/PrecioBolsa.py", source: WORKSPACE }
        - task_key: ing_embalses
          depends_on: [{ task_key: setup_catalog }]
          environment_key: default
          notebook_task: { notebook_path: "${workspace.file_path}/Ingestion/Embalses.py", source: WORKSPACE }
        - task_key: ing_plantas_reservorios
          depends_on: [{ task_key: setup_catalog }]
          environment_key: default
          notebook_task: { notebook_path: "${workspace.file_path}/Ingestion/embalse_plantas.py", source: WORKSPACE }

        - task_key: bronze_daily
          depends_on:
            - { task_key: ing_demanda_real }
            - { task_key: ing_disponibilidad }
            - { task_key: ing_agentes }
            - { task_key: ing_generacion_real }
            - { task_key: ing_niveles_embalses }
            - { task_key: ing_plantas }
            - { task_key: ing_precio_bolsa }
            - { task_key: ing_embalses }
            - { task_key: ing_plantas_reservorios }
          notebook_task: { notebook_path: "${workspace.file_path}/Bronze_Load/02_bronze_daily.py", source: WORKSPACE }
          environment_key: default

        - task_key: slv_agentes
          depends_on: [{ task_key: bronze_daily }]
          notebook_task: { notebook_path: "${workspace.file_path}/Silver_Load/silver_agentes.py", source: WORKSPACE }
          environment_key: default
        - task_key: slv_plantas
          depends_on: [{ task_key: bronze_daily }]
          notebook_task: { notebook_path: "${workspace.file_path}/Silver_Load/silver_plantas.py", source: WORKSPACE }
          environment_key: default
        - task_key: slv_embalses
          depends_on: [{ task_key: bronze_daily }]
          notebook_task: { notebook_path: "${workspace.file_path}/Silver_Load/silver_embalses.py", source: WORKSPACE }
          environment_key: default
        - task_key: slv_precio_bolsa
          depends_on: [{ task_key: bronze_daily }]
          notebook_task: { notebook_path: "${workspace.file_path}/Silver_Load/silver_precio_bolsa.py", source: WORKSPACE }
          environment_key: default
        - task_key: slv_demanda_real
          depends_on: [{ task_key: bronze_daily }, { task_key: slv_agentes }]
          notebook_task: { notebook_path: "${workspace.file_path}/Silver_Load/silver_demanda_real.py", source: WORKSPACE }
          environment_key: default
        - task_key: slv_disponibilidad
          depends_on: [{ task_key: bronze_daily }, { task_key: slv_plantas }]
          notebook_task: { notebook_path: "${workspace.file_path}/Silver_Load/silver_disponibilidad_plantas.py", source: WORKSPACE }
          environment_key: default
        - task_key: slv_generacion
          depends_on: [{ task_key: bronze_daily }, { task_key: slv_agentes }, { task_key: slv_plantas }]
          notebook_task: { notebook_path: "${workspace.file_path}/Silver_Load/silver_generacion_real.py", source: WORKSPACE }
          environment_key: default
        - task_key: slv_niveles_embalses
          depends_on: [{ task_key: bronze_daily }, { task_key: slv_plantas }]
          notebook_task: { notebook_path: "${workspace.file_path}/Silver_Load/silver_niveles_embalses.py", source: WORKSPACE }
          environment_key: default
        - task_key: slv_plantas_reservorios
          depends_on: [{ task_key: bronze_daily }, { task_key: slv_plantas }, { task_key: slv_embalses }]
          notebook_task: { notebook_path: "${workspace.file_path}/Silver_Load/silver_plantas_reservorios.py", source: WORKSPACE }
          environment_key: default

        - task_key: gold_daily
          depends_on:
            - { task_key: slv_demanda_real }
            - { task_key: slv_precio_bolsa }
            - { task_key: slv_niveles_embalses }
            - { task_key: slv_plantas_reservorios }
            - { task_key: slv_disponibilidad }
            - { task_key: slv_agentes }
            - { task_key: slv_generacion }
          notebook_task: { notebook_path: "${workspace.file_path}/GOLD LOAD/GOLD_LOAD.py", source: WORKSPACE }
          environment_key: default
          max_retries: 1
          min_retry_interval_millis: 300000
        - task_key: quality_check
          depends_on: [{ task_key: gold_daily }]
          notebook_task: { notebook_path: "${workspace.file_path}/Automation/gold_incremental_quality_checks.py", source: WORKSPACE }
          environment_key: default
        - task_key: gold_analytics
          depends_on: [{ task_key: quality_check }]
          notebook_task: { notebook_path: "${workspace.file_path}/Gold_Analytics/01_vistas_dashboard.py", source: WORKSPACE }
          environment_key: default
      queue: { enabled: true }
      performance_target: PERFORMANCE_OPTIMIZED
